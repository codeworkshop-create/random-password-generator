<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        
            <h1 class="title">Random Password Generator</h1>
        <div class="container">
        <div class = "border">
            <div >
                <label for="length">Password Length:</label>
                <input type="number" id="length" name="length" min="8" max="128" value="12">
            </div>
            <div>
                <label for="uppercase">Include Uppercase Letters:</label>
                <input type="checkbox" id="uppercase" name="uppercase" checked>
            </div> 
            <div>
                <label for="lowercase">Include Lowercase Letters:</label>
                <input type="checkbox" id="lowercase" name="lowercase" checked>
            </div>
            <div>
                <label for="numbers">Include Numbers:</label>
                <input type="checkbox" id="numbers" name="numbers" checked>
            </div>
            <div>
                <label for="special">Include Special Characters:</label>
                <input type="checkbox" id="special" name="special" checked>
            </div>
            <div>
                <label for="password">Generated Password:</label>
                <input type="text" id="password" name="password" readonly>
            </div>
            <div class="button-container">
                <button id="btn" class="glow-on-hover" >Generate Password</button>
                <button id="copy"><img src="components/images/copy-icon.png" alt="Copy Password"></button>
            </div> 
        </div>     
    </main>
    <script src="./index.js"></script>
</body>
</html>
